worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Resolver embebido de Docker: permite a nginx re-resolver el nombre
    # "backend-service" en cada request en vez de resolverlo una sola vez
    # al arrancar. Docker devuelve un registro DNS distinto (round-robin)
    # por cada réplica activa, así que esto es lo que realmente reparte
    # el tráfico entre las 3 réplicas sin necesitar reiniciar nginx cada
    # vez que escalas hacia arriba o hacia abajo.
    resolver 127.0.0.11 valid=5s ipv6=off;

    log_format finflow '$remote_addr - [$time_local] "$request" '
                        'upstream=$upstream_addr status=$status';

    access_log /var/log/nginx/access.log finflow;

    server {
        listen 80;
        server_name _;

        location /health {
            return 200 "gateway ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            set $backend_upstream "backend-service";
            proxy_pass http://$backend_upstream:3000;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 3s;
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
